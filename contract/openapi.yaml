openapi: 3.0.0
info:
  title: Календарь звонков
  description: Call booking API. Operations are named in camelCase, so each `operationId` equals the operation name.
  version: 0.0.0
tags: []
paths:
  /api/event-types:
    get:
      operationId: listEventTypes
      description: All event types in creation order.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
    post:
      operationId: createEventType
      description: Checks the data first, then whether the id is taken.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '400':
          description: The request breaks the contract schema; Fastify's request validation answers it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: Another event type already has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeIdTakenError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventType'
  /api/event-types/{id}:
    get:
      operationId: getEventType
      description: The path `id` has no `pattern` or `maxLength`, so any unknown id gets 404, never 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '404':
          description: No event type has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeNotFoundError'
  /api/health:
    get:
      operationId: getHealth
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    ApiError:
      type: object
      required:
        - statusCode
        - code
        - error
        - message
      properties:
        statusCode:
          type: integer
          format: int32
        code:
          type: string
        error:
          type: string
        message:
          type: string
      description: |-
        Error body in Fastify's format; clients tell errors apart by `code`.
        A concrete error extends it with `@statusCode` and a literal `code`.
    EventType:
      type: object
      required:
        - id
        - title
        - durationMinutes
      properties:
        id:
          type: string
          maxLength: 50
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: Part of the booking page address, e.g. `intro-30`.
        title:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
          description: At least one non-whitespace character.
        description:
          type: string
          maxLength: 500
          description: Plain text; absent when the owner gave none.
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 540
          multipleOf: 15
      description: A kind of call the owner offers.
    EventTypeIdTakenError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - EVENT_TYPE_ID_TAKEN
      allOf:
        - $ref: '#/components/schemas/ApiError'
      description: Another event type already has this id.
    EventTypeNotFoundError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - EVENT_TYPE_NOT_FOUND
      allOf:
        - $ref: '#/components/schemas/ApiError'
      description: No event type has this id.
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    RouteNotFoundError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - ROUTE_NOT_FOUND
      allOf:
        - $ref: '#/components/schemas/ApiError'
      description: No route matches a path under `/api/`. No operation returns it, so the server answers it from its not-found handler.
    ValidationError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - FST_ERR_VALIDATION
      allOf:
        - $ref: '#/components/schemas/ApiError'
      description: The request breaks the contract schema; Fastify's request validation answers it.
