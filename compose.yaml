# Dev services. Each worktree runs its own copy as a separate Compose project
# (COMPOSE_PROJECT_NAME in the worktree's .env), so copies never share
# containers, networks or volumes.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
      POSTGRES_DB: calendar
    # Random free host port per copy; find it with `docker compose port db 5432`.
    ports:
      - "127.0.0.1::5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
